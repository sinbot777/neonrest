name: UI styling checks

on:
  pull_request:
    paths:
      - 'templates/service_accounts.html'
      - 'templates/base.html'
      - 'static/**/*.css'
      - 'tests/verify_service_style_cascade.py'
      - 'requirements-ui-checks.txt'
      - '.github/workflows/ui-style-checks.yml'
  push:
    branches: [main]
    paths:
      - 'templates/service_accounts.html'
      - 'templates/base.html'
      - 'static/**/*.css'
      - 'tests/verify_service_style_cascade.py'
      - 'requirements-ui-checks.txt'
      - '.github/workflows/ui-style-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-style-cascade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install isolated styling-check dependencies
        run: python -m pip install Jinja2==3.1.6 -r requirements-ui-checks.txt
      - name: Check Service controls against the shared settings cascade
        run: python -m unittest discover -s tests -p verify_service_style_cascade.py
