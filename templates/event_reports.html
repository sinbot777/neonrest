{% extends 'base.html' %}{% block content %}{% include 'partials/identity_page_styles.html' %}<main class="identity-page"><h1>Review event reports</h1>{% for report in reports %}<article><h2>Report #{{ report.id }} · {{ report.status }}</h2><p>{{ report.reason }}</p><pre class="page-description">{{ report.snapshot }}</pre><form method="post"><input type="hidden" name="theme_csrf_token" value="{{ community_token() }}"><input type="hidden" name="report_id" value="{{ report.id }}"><label for="event-decision-{{ report.id }}">Decision</label><select id="event-decision-{{ report.id }}" name="decision"><option value="dismiss">Dismiss</option><option value="hide">Hide event</option><option value="restore">Restore event</option></select><label for="event-reason-{{ report.id }}">Decision reason</label><textarea id="event-reason-{{ report.id }}" name="reason" maxlength="1000" required></textarea><button>Record decision</button></form></article>{% else %}<p>No event reports.</p>{% endfor %}</main>{% endblock %}
