{% extends 'base.html' %}
{% block content %}
<h1>Who reacted? {{ emoji }}</h1>
<form method="get"><label>Reaction <select name="emoji">
{% for value in ['👍','👎','🕶️','💖','💩','🤮','❓','🔥','🐐','🦙'] %}
<option value="{{ value }}"{% if value==emoji %} selected{% endif %}>{{ value }}</option>
{% endfor %}</select></label> <button type="submit">Show people</button></form>
<ul>{% for person in people %}<li><a href="{{ url_for('user_by_handle',handle=person.handle.lstrip('@')) }}">@{{ person.handle.lstrip('@') }}</a></li>{% else %}<li>No visible people for this reaction.</li>{% endfor %}</ul>
{% if next_url %}<a href="{{ next_url }}">More people</a>{% endif %}
<p><a href="{{ url_for('post_detail',post_id=post_ref) }}">Back to post</a></p>
{% endblock %}
