<style>.reading-panel{box-sizing:border-box;width:100%;max-width:760px;margin:1rem auto;padding:1.4rem;background:#202936;color:#f7f0df;border:1px solid #a8a4b0;border-radius:16px;overflow-wrap:anywhere}.reading-panel a,.reading-links a,.reading-feed-nav a{color:#ffd5ba;text-decoration:underline}.reading-links,.reading-feed-nav{display:flex;gap:.65rem;flex-wrap:wrap;margin:1rem 0}.reading-feed-nav a{padding:.4rem .65rem;border:1px solid currentColor;border-radius:8px}.reading-feed-nav a[aria-current=page]{background:#ffd5ba;color:#202936}.reading-panel input:not([type=checkbox]),.reading-panel select,.reading-panel textarea{box-sizing:border-box;max-width:100%;background:#fff7ee;color:#202936;border:1px solid #9d8f83;border-radius:6px;padding:.5rem}.reading-panel textarea{width:100%;min-height:12rem}.reading-panel button,.reading-bookmark-button{background:#ffd5ba;color:#202936;border:1px solid #9d8f83;border-radius:7px;padding:.45rem .7rem;cursor:pointer}.reading-panel fieldset{margin:1rem 0;min-width:0}.reading-panel fieldset label{display:block;padding:.3rem}.reading-panel article{border-top:1px solid #aaa;padding:1rem 0}.reading-panel a:focus-visible,.reading-panel button:focus-visible,.reading-feed-nav a:focus-visible,.reading-bookmark-button:focus-visible{outline:3px solid #9ee5ff;outline-offset:3px}.reading-panel pre{white-space:pre-wrap;overflow-wrap:anywhere}.reading-panel .reading-inline{display:inline-block;margin:.3rem}.reading-bookmark-form{margin:.7rem 0}.reading-panel label{overflow-wrap:anywhere}</style>
