<style>
.identity-page{box-sizing:border-box;max-width:800px;margin:1.5rem auto;padding:1.25rem;overflow-wrap:anywhere;background:rgba(12,18,29,.94);color:#f3f4f6;border:1px solid #8793a8;border-radius:.8rem}
.identity-page a{color:inherit;text-decoration:underline;text-underline-offset:.15em}
.identity-page nav{display:flex;flex-wrap:wrap;gap:1rem;margin-bottom:1rem}
.identity-page form{display:block;max-width:100%;margin:1rem 0;padding:1rem;border:1px solid currentColor;border-radius:.6rem}
.identity-page label{display:block;margin:.8rem 0}
.identity-page input,.identity-page textarea,.identity-page select{box-sizing:border-box;display:block;width:100%;max-width:100%;font:inherit;padding:.6rem;background:var(--bg-color,#111827);color:var(--text-color,#f3f4f6);border:1px solid currentColor;border-radius:.3rem}
.identity-page label:has(> input[type="checkbox"]){display:flex;align-items:flex-start;gap:.6rem;cursor:pointer}
.identity-page input[type="checkbox"]{display:inline-block;flex:0 0 auto;width:1.1rem;height:1.1rem;margin:.2em 0 0;padding:0}
.identity-page textarea{min-height:10rem}
.identity-page button,.identity-page .button{font:inherit;min-height:44px;padding:.5rem .8rem;background:#d9f4ff;color:#122032;border:1px solid #aacbda;border-radius:.35rem;cursor:pointer}
.identity-page form>button,.identity-page form>.button{margin-top:.75rem}
.identity-page article{padding:1rem 0;border-bottom:1px solid currentColor}
.identity-page .page-description{white-space:pre-wrap}
.identity-page .page-handle{font-size:1.1rem}
.identity-page input:focus-visible,.identity-page textarea:focus-visible,.identity-page select:focus-visible,.identity-page a:focus-visible,.identity-page button:focus-visible{outline:3px solid currentColor;outline-offset:3px}

.identity-page.page-profile{max-width:1120px;padding:0;--page-accent:#7dd3c7}
.page-profile.page-accent-violet{--page-accent:#c4b5fd}.page-profile.page-accent-rose{--page-accent:#fda4af}.page-profile.page-accent-amber{--page-accent:#fcd34d}.page-profile.page-accent-blue{--page-accent:#93c5fd}.page-profile.page-accent-green{--page-accent:#bef264}
.page-profile-cover{height:200px;background:linear-gradient(135deg,#172032 0%,#243649 55%,var(--page-accent) 180%);overflow:hidden;border-radius:.8rem .8rem 0 0}
.page-profile-cover img{width:100%;height:100%;object-fit:cover;display:block}
.page-profile-heading{display:flex;align-items:center;gap:1.2rem;padding:0 1.5rem;margin-top:-36px;position:relative}
.page-profile-heading h1{font-size:clamp(1.5rem,4vw,2.2rem);margin:2.8rem 0 .3rem}.page-profile-heading p{margin:.4rem 0}
.page-profile-avatar{flex:0 0 112px;width:112px;height:112px;object-fit:cover;border:4px solid #172032;border-radius:1rem;background:var(--page-accent);box-sizing:border-box}
.page-profile-initial{display:grid;place-items:center;color:#172032;font-size:3rem;font-weight:bold}
.page-profile-actions{padding:0 1.5rem}.page-profile-actions form{display:inline-block;border:0;padding:0;margin:.75rem 0}.page-profile-actions form>button{margin:0}
.page-profile .page-profile-tabs{padding:1rem 1.5rem;margin:0;border-bottom:1px solid #66758b;gap:1.5rem}
.page-profile-layout{display:grid;grid-template-columns:minmax(230px,1fr) minmax(0,2fr);gap:1.5rem;padding:1.5rem}
.page-profile-about{padding:1.1rem;background:#202b3b;border:1px solid #526479;border-radius:.7rem;align-self:start;min-width:0}
.page-profile-about h2,.page-profile-feed h2{margin-top:0}.page-profile-feed{min-width:0}
.page-profile-about .page-description{font-size:.95rem;line-height:1.6}.page-profile-feed .page-description{line-height:1.6}
.page-profile .page-update-card{padding:1rem;margin-bottom:1rem;border:1px solid #526479;border-left:3px solid var(--page-accent);border-radius:.6rem;background:#202b3b}
.page-profile-settings{margin:1rem 0}.page-profile-settings summary{padding:.8rem;cursor:pointer;border:1px solid #8793a8;border-radius:.4rem;font-weight:bold}
.page-avatar-preview{display:block;max-width:100px;max-height:100px;margin-top:1rem}.page-cover-preview{display:block;width:100%;max-height:180px;object-fit:cover;margin-top:1rem}
.page-sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:700px){.page-profile-layout{grid-template-columns:1fr;padding:1rem;gap:1rem}.page-profile-cover{height:140px}.page-profile-heading{padding:0 1rem;gap:.8rem}.page-profile-avatar{width:80px;height:80px;flex-basis:80px}.page-profile-heading h1{margin-top:2.8rem}.page-profile-actions{padding:0 1rem}.page-profile .page-profile-tabs{padding:1rem}}
</style>
