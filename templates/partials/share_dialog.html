<dialog id="neon-share-dialog" class="neon-share-dialog" aria-labelledby="neon-share-heading" aria-describedby="neon-share-notice">
  <h2 id="neon-share-heading">Share</h2>
  <p id="neon-share-notice"></p><p>Share on Neonrest can display the original text and attachments. Circle posts require their author to allow sharing outside the Circle.</p>
  <label for="neon-share-link">Link to the original</label>
  <input id="neon-share-link" type="url" readonly>
  <div class="neon-share-actions"><button type="button" id="neon-share-copy">Copy link</button><button type="button" id="neon-share-device" hidden>Share using your device</button><a id="neon-share-compose" class="neon-share-button">Share on Neonrest</a></div>
  <p id="neon-share-status" role="status" aria-live="polite"></p>
  <form method="dialog"><button type="submit">Close</button></form>
</dialog>
