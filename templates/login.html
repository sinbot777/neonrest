{% extends 'base.html' %}
{% block title %}Log In - Neonrest{% endblock %}

{% block content %}
  <div class="auth-box">
    <div class="glow">Log In</div>
    <form method="POST"><input type="hidden" name="theme_csrf_token" value="{{ community_token() }}">
      <input type="email" name="email" placeholder="Email" required><br>
      <input type="password" name="password" placeholder="Password" required><br>
      <button type="submit">Log In</button>
    </form>
    <p><a href="{{ url_for('password_reset_request') }}">Forgot your password?</a></p><p><a href="{{ url_for('verification_request') }}">Resend verification email</a></p><p class="auth-link">Need an account? <a href="/sandbox/signup">Sign up</a></p>
  </div>
  <div class="under-construction">
  <a href="{{ url_for('dev_summary') }}">
    <img src="{{ url_for('static', filename='img/underconstruction.gif') }}" alt="Under Construction">
  </a>
</div>
{% endblock %}
