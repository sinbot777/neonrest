<div class="ad-stack"><div class="rail-eyebrow">Advertisements</div>
{% for ad in rail_ads %}<article class="ad-card"><a href="{{ url_for('ad_click', campaign_id=ad.id) }}" target="_blank" rel="sponsored noopener noreferrer" referrerpolicy="no-referrer" aria-label="Advertisement: {{ ad.title }}">
{% if ad.image_path %}<img src="{{ url_for('static',filename=ad.image_path[8:]) }}" alt="" loading="lazy">{% endif %}<strong>{{ ad.title }}</strong><span>{{ ad.body }}</span></a></article>{% endfor %}</div>
{% include 'ad_style.html' %}
