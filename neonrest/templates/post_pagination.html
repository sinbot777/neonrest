{% if total_pages > 1 %}<nav class="post-pagination" aria-label="Post pages">
  {% if page > 1 %}<a href="{{ url_for(request.endpoint, vibe_name=vibe_name, mode=theme_mode, page=page-1) if request.endpoint == 'vibe_page' else url_for('feed', page=page-1) }}">← Newer posts</a>{% endif %}
  <span>Page {{ page }} of {{ total_pages }}</span>
  {% if page < total_pages %}<a href="{{ url_for(request.endpoint, vibe_name=vibe_name, mode=theme_mode, page=page+1) if request.endpoint == 'vibe_page' else url_for('feed', page=page+1) }}">Older posts →</a>{% endif %}
</nav><style>.post-pagination{display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap;margin:1.5rem 0;padding:1rem;border:1px solid currentColor;border-radius:12px}.post-pagination a{color:inherit;text-decoration:underline}</style>{% endif %}
